<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTML Candy World — ผจญภัยดินแดนโค้ดมหัศจรรย์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen game app — stacked screens inside a framed candy window, canvas scenes + DOM UI */
:root {
  --pink: #ffb8d6;
  --pink-deep: #f0629f;
  --lav: #cfc0f5;
  --lav-deep: #7d5ad8;
  --blue: #c4e5ff;
  --blue-deep: #3f9ad8;
  --mint: #b2efd6;
  --mint-deep: #2fae7c;
  --cream: #fff4cc;
  --cream-deep: #f2b93b;
  --white: #fffaf5;
  --ink: #4b3268;
  --ink-soft: #7c6a96;
  --line: #ecd9f2;
  --shadow: 0 10px 28px rgba(125, 90, 216, .18);
  --shadow-sm: 0 4px 12px rgba(125, 90, 216, .16);
  --ok: #2fae7c;
  --bad: #e2577f;
  --font-display: 'Itim', 'Mali', 'Leelawadee UI', 'Tahoma', sans-serif;
  --font-body: 'Mali', 'Itim', 'Leelawadee UI', 'Tahoma', sans-serif;
  --font-code: 'JetBrains Mono', 'Consolas', 'Menlo', monospace;
  --fs: 1;
  --radius: 22px;
  color-scheme: light;
}
html { font-size: calc(16px * var(--fs)); height: 100%; }
body {
  height: 100%;
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background: radial-gradient(120% 90% at 20% 0%, #ffe3f1 0%, #efe4ff 45%, #dcefff 100%);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; line-height: 1.6; }
code, .code { font-family: var(--font-code); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- App frame ---------- */
#app {
  position: relative;
  height: 100%;
  max-width: 1400px;
  margin: 0 auto;
  border-radius: 28px;
  overflow: hidden;
  background: var(--white);
  box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--lav), 0 18px 50px rgba(125, 90, 216, .25);
}
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: screenIn .45s ease both;
}
@keyframes screenIn { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }
.scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; flex: 1; }
.bg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.layer { position: relative; z-index: 1; }

/* ---------- Buttons ---------- */
.btn {
  --b: var(--pink-deep); --b2: #ff8fc0; --bs: #c2417a; --bt: #fff;
  appearance: none; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 46px; padding: .55em 1.25em;
  border-radius: 999px;
  font-family: var(--font-display); font-size: 1.08rem; letter-spacing: .02em;
  color: var(--bt);
  background: linear-gradient(180deg, var(--b2) 0%, var(--b) 100%);
  box-shadow: 0 5px 0 var(--bs), 0 8px 18px rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.55);
  transition: transform .12s ease, box-shadow .12s ease, filter .12s;
  text-shadow: 0 1px 0 rgba(0,0,0,.12);
  position: relative;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.04); box-shadow: 0 7px 0 var(--bs), 0 12px 22px rgba(0,0,0,.14), inset 0 2px 0 rgba(255,255,255,.55); }
.btn:active, .btn.pressed { transform: translateY(4px); box-shadow: 0 1px 0 var(--bs), 0 3px 8px rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.4); }
.btn:focus-visible, .icon-btn:focus-visible, .chip:focus-visible, .card-btn:focus-visible, .node:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .tile:focus-visible {
  outline: 3px solid #fff; box-shadow: 0 0 0 6px var(--lav-deep); outline-offset: 0;
}
.btn[disabled] { filter: grayscale(.7) opacity(.6); cursor: not-allowed; transform: none; }
.btn.mint { --b: var(--mint-deep); --b2: #6fd8ad; --bs: #1f8a5f; }
.btn.lav { --b: var(--lav-deep); --b2: #a68bf0; --bs: #5a3cb0; }
.btn.blue { --b: var(--blue-deep); --b2: #7cc4f2; --bs: #2a73a8; }
.btn.cream { --b: var(--cream-deep); --b2: #ffd772; --bs: #c58b12; --bt: #5b3a00; text-shadow: none; }
.btn.ghost { --b: #fff; --b2: #fff; --bs: var(--line); --bt: var(--ink); text-shadow: none; }
.btn.small { min-height: 38px; font-size: .95rem; padding: .35em .95em; }
.btn.big { min-height: 58px; font-size: 1.35rem; padding: .6em 1.8em; }
.btn svg { width: 1.2em; height: 1.2em; flex: none; }

.icon-btn {
  appearance: none; border: 2px solid #fff; cursor: pointer;
  width: 46px; height: 46px; border-radius: 16px;
  display: inline-grid; place-items: center;
  background: linear-gradient(180deg, #fff 0%, #f6edff 100%);
  color: var(--lav-deep);
  box-shadow: 0 4px 0 var(--lav), var(--shadow-sm);
  transition: transform .12s, box-shadow .12s;
}
.icon-btn:hover { transform: translateY(-2px); }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--lav); }
.icon-btn svg { width: 24px; height: 24px; }

.chip {
  appearance: none; cursor: pointer;
  border: 2px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 999px; padding: .3em .85em; min-height: 36px;
  font-family: var(--font-code); font-size: .9rem;
  transition: background .15s, border-color .15s, transform .1s;
}
.chip:hover { border-color: var(--lav); background: #faf6ff; }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--lav-deep); border-color: var(--lav-deep); color: #fff; }

/* ---------- Panels ---------- */
.panel {
  background: rgba(255, 252, 248, .94);
  border: 3px solid #fff;
  border-radius: var(--radius);
  box-shadow: 0 0 0 2px var(--line), var(--shadow);
}
.ribbon {
  display: inline-block; font-family: var(--font-display); font-size: .85rem; letter-spacing: .08em; text-transform: uppercase;
  background: var(--lav); color: var(--ink); padding: .15em .8em; border-radius: 999px;
}
.muted { color: var(--ink-soft); }
.stat {
  display: inline-flex; align-items: center; gap: .35em; font-family: var(--font-display); font-size: 1.05rem;
  background: #fff; border-radius: 999px; padding: .2em .8em .2em .35em; box-shadow: 0 0 0 2px var(--line);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.stat svg { width: 24px; height: 24px; flex: none; }
.bar { height: 14px; border-radius: 999px; background: #f1e8fa; box-shadow: inset 0 2px 3px rgba(0,0,0,.08); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ff9cc8, #c8a6ff, #8fd6ff, #8ff0c6); background-size: 300% 100%; animation: barShine 6s linear infinite; transition: width .6s cubic-bezier(.2,.8,.2,1); }
@keyframes barShine { to { background-position: 300% 0; } }

/* ---------- Splash ---------- */
.splash-inner { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding: 24px 16px; }
.logo { line-height: .95; }
.logo .l1 { display: block; font-family: var(--font-display); font-size: clamp(2.6rem, 8vw, 5.4rem); color: #fff;
  -webkit-text-stroke: 0; text-shadow: 0 3px 0 var(--pink-deep), 0 6px 0 var(--lav-deep), 0 12px 24px rgba(125,90,216,.35); letter-spacing: .03em; }
.logo .l1 .word { display: inline-block; white-space: nowrap; margin: 0 .14em; }
.logo .l1 .word span { display: inline-block; animation: logoBob 2.6s ease-in-out infinite; }
.logo .l2 { display: block; margin-top: .25em; font-family: var(--font-display); font-size: clamp(1.1rem, 3.2vw, 1.8rem); color: var(--lav-deep); letter-spacing: .3em; }
.logo .l3 { display: block; margin-top: .35em; font-size: clamp(1rem, 2.6vw, 1.3rem); color: var(--ink); }
@keyframes logoBob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
.menu-col { display: flex; flex-direction: column; gap: 14px; align-items: stretch; width: min(320px, 100%); }
.menu-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.storage-warn { font-size: .9rem; background: #fff1f5; border: 2px dashed var(--pink); color: #a33a67; border-radius: 14px; padding: .5em .9em; max-width: 420px; }

/* ---------- Profile ---------- */
.page-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px 6px; flex-wrap: wrap; }
.page-head h2 { font-size: clamp(1.4rem, 3.4vw, 2rem); flex: 1; min-width: 0; }
.profile-wrap { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; padding: 8px 16px 18px; align-items: start; }
.char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.card-btn {
  appearance: none; cursor: pointer; border: 3px solid #fff; background: linear-gradient(180deg, #fff, #fbf5ff);
  border-radius: 20px; padding: 10px 8px 12px; text-align: center; box-shadow: 0 0 0 2px var(--line), var(--shadow-sm);
  display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .15s, box-shadow .15s;
}
.card-btn:hover { transform: translateY(-3px); }
.card-btn[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--pink-deep), var(--shadow); background: linear-gradient(180deg, #fff, #ffeaf4); }
.card-btn canvas { width: 100%; max-width: 130px; aspect-ratio: 1; }
.card-btn b { font-family: var(--font-display); font-size: 1.15rem; font-weight: 400; }
.card-btn small { color: var(--ink-soft); font-size: .82rem; line-height: 1.4; }
.preview-stage { padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.preview-stage canvas { width: 100%; max-width: 280px; aspect-ratio: 1; }
.field { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.field label { font-family: var(--font-display); font-size: 1.05rem; }
.input {
  border: 3px solid var(--line); border-radius: 16px; padding: .6em .9em; background: #fff; min-height: 48px; width: 100%;
}
.input:focus { border-color: var(--lav-deep); outline: none; }

/* ---------- Dialog / story ---------- */
.dialog {
  display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center;
  padding: 14px; margin: 0 auto; width: min(760px, 100%);
}
.dialog canvas.portrait { width: 96px; height: 96px; border-radius: 20px; background: linear-gradient(180deg, #fff, #f6eeff); box-shadow: 0 0 0 2px var(--line); }
.dialog .who { font-family: var(--font-display); font-size: 1.15rem; color: var(--lav-deep); }
.dialog .say { font-size: 1.05rem; min-height: 3.2em; }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; grid-column: 1 / -1; }
.goal-list { display: grid; gap: 6px; margin: 6px 0 0; padding: 0; list-style: none; }
.goal-list li { display: flex; gap: 8px; align-items: center; }
.goal-list li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--mint-deep); box-shadow: 0 0 0 3px var(--mint); flex: none; }

/* ---------- World map ---------- */
.map-top { display: flex; align-items: center; gap: 10px; padding: 10px 12px; flex-wrap: wrap; position: relative; z-index: 2; }
.map-top .who { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.map-top .who canvas { width: 52px; height: 52px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 2px var(--line); flex: none; }
.map-top .who b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-progress { width: 100%; display: flex; align-items: center; gap: 10px; font-size: .9rem; }
.map-progress .bar { flex: 1; }
.map-area { position: relative; flex: 1; min-height: 0; }
.map-area canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.node {
  position: absolute; transform: translate(-50%, -50%);
  appearance: none; border: 3px solid #fff; cursor: pointer;
  background: rgba(255,255,255,.95); border-radius: 18px; padding: 6px 10px 6px;
  box-shadow: 0 0 0 2px var(--line), var(--shadow-sm); text-align: center; min-width: 118px; max-width: 160px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .15s;
  z-index: 2;
}
.node:hover:not(.locked) { transform: translate(-50%, -54%); }
.node .num { position: absolute; top: -14px; left: -10px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--pink-deep); color: #fff; font-family: var(--font-display); box-shadow: 0 0 0 3px #fff; }
.node b { font-family: var(--font-display); font-weight: 400; font-size: 1rem; line-height: 1.1; }
.node small { font-size: .72rem; color: var(--ink-soft); line-height: 1.2; }
.node .stars { display: flex; gap: 1px; }
.node .stars svg { width: 18px; height: 18px; }
.node.locked { filter: grayscale(.85); opacity: .78; cursor: not-allowed; }
.node.locked .num { background: #a99bbb; }
.node.current { box-shadow: 0 0 0 3px var(--pink-deep), 0 0 0 9px rgba(240,98,159,.18), var(--shadow); animation: nodePulse 2s ease-in-out infinite; }
@keyframes nodePulse { 50% { box-shadow: 0 0 0 3px var(--pink-deep), 0 0 0 14px rgba(240,98,159,.08), var(--shadow); } }
.pin { position: absolute; transform: translate(-50%, -100%); z-index: 2; appearance: none; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0; }
.pin .pin-body { width: 54px; height: 54px; border-radius: 18px 18px 18px 4px; transform: rotate(-45deg); display: grid; place-items: center; background: var(--cream-deep); box-shadow: 0 0 0 3px #fff, var(--shadow-sm); }
.pin .pin-body svg { transform: rotate(45deg); width: 28px; height: 28px; color: #fff; }
.pin .pin-lbl { font-family: var(--font-display); font-size: .85rem; background: #fff; padding: 0 .6em; border-radius: 999px; box-shadow: 0 0 0 2px var(--line); margin-top: 8px; }
.pin .alert { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--pink-deep); color: #fff; font-family: var(--font-display); display: grid; place-items: center; box-shadow: 0 0 0 3px #fff; animation: logoBob 1.4s ease-in-out infinite; }
.map-nav { display: flex; gap: 8px; padding: 10px 12px; justify-content: center; flex-wrap: wrap; position: relative; z-index: 2; background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.85) 40%); }

/* ---------- Gameplay ---------- */
#game-wrap { position: relative; flex: 1; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
#game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 8px; padding: 10px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; z-index: 3; }
.hud > * { pointer-events: auto; }
.hud .spacer { flex: 1; }
.quest-card { max-width: min(380px, 100%); padding: 8px 12px; font-size: .92rem; display: flex; flex-direction: column; gap: 4px; }
.quest-card b { font-family: var(--font-display); font-weight: 400; color: var(--lav-deep); font-size: 1rem; }
.quest-card .bar { height: 10px; }
.quest-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .82rem; }
.quest-list li { display: flex; gap: 4px; align-items: center; }
.quest-list li i { width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--lav); display: inline-block; }
.quest-list li.done i { background: var(--mint-deep); border-color: var(--mint-deep); }
.quest-list li.done { color: var(--ink-soft); text-decoration: line-through; }
.touch { position: absolute; bottom: 12px; left: 12px; right: 12px; display: none; justify-content: space-between; pointer-events: none; z-index: 3; }
.touch.show { display: flex; }
.touch .grp { display: flex; gap: 12px; pointer-events: auto; }
.tbtn {
  width: 66px; height: 66px; border-radius: 50%; border: 3px solid rgba(255,255,255,.95);
  background: rgba(125, 90, 216, .42); color: #fff; display: grid; place-items: center;
  box-shadow: 0 4px 0 rgba(90, 60, 176, .45); touch-action: none; font-family: var(--font-display); font-size: 1.3rem;
  backdrop-filter: blur(4px);
}
.tbtn.on { background: rgba(240, 98, 159, .7); transform: translateY(3px); box-shadow: none; }
.tbtn svg { width: 30px; height: 30px; }
.interact-tip { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3; pointer-events: none; }
.interact-tip .panel { padding: 6px 14px; font-size: .95rem; display: flex; gap: 8px; align-items: center; }
kbd { font-family: var(--font-code); background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 8px; padding: 0 .45em; font-size: .9em; }

/* ---------- Modal ---------- */
.modal-back {
  position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 12px;
  background: rgba(75, 50, 104, .38); backdrop-filter: blur(3px); animation: fadeIn .2s ease both;
}
@keyframes fadeIn { from { opacity: 0; } }
.modal {
  width: min(560px, 100%); max-height: 100%; overflow: auto; overscroll-behavior: contain;
  padding: 18px; display: flex; flex-direction: column; gap: 12px; animation: popIn .32s cubic-bezier(.2,1.4,.4,1) both;
}
.modal.wide { width: min(1040px, 100%); }
.modal.mid { width: min(760px, 100%); }
@keyframes popIn { from { transform: scale(.85) translateY(10px); opacity: 0; } }
.modal-head { display: flex; align-items: center; gap: 10px; }
.modal-head h3 { flex: 1; font-size: 1.45rem; min-width: 0; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.mg-head { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.mg-head canvas { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(180deg, #fff, #f6eeff); box-shadow: 0 0 0 2px var(--line); }
.mg-head .t { min-width: 0; }
.mg-head .t h3 { font-size: 1.3rem; }
.mg-head .t p { font-size: .9rem; color: var(--ink-soft); }
.mg-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.feedback { border-radius: 16px; padding: 10px 14px; font-size: .98rem; display: flex; gap: 10px; align-items: flex-start; }
.feedback.ok { background: #e8fbf2; color: #1d6e4f; box-shadow: 0 0 0 2px #b8eed7; }
.feedback.bad { background: #fff0f5; color: #9b2f57; box-shadow: 0 0 0 2px #ffd0e1; }
.feedback.info { background: #f3eeff; color: var(--lav-deep); box-shadow: 0 0 0 2px var(--lav); }
.feedback svg { width: 24px; height: 24px; flex: none; margin-top: 2px; }

/* Quiz */
.quiz-q { font-size: 1.2rem; font-family: var(--font-display); line-height: 1.45; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt {
  appearance: none; cursor: pointer; text-align: left; border: 3px solid #fff; border-radius: 18px; padding: 12px 14px;
  background: linear-gradient(180deg, #fff, #fbf6ff); box-shadow: 0 0 0 2px var(--line), 0 4px 0 var(--line);
  display: flex; gap: 10px; align-items: center; min-height: 56px; transition: transform .1s, box-shadow .15s;
}
.opt:hover:not([disabled]) { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--lav), 0 6px 0 var(--lav); }
.opt:focus-visible { outline: 3px solid var(--lav-deep); }
.opt .k { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--lav); color: var(--ink); font-family: var(--font-display); flex: none; }
.opt .tx { min-width: 0; overflow-wrap: anywhere; }
.opt.right { background: #e8fbf2; box-shadow: 0 0 0 3px var(--mint-deep); }
.opt.right .k { background: var(--mint-deep); color: #fff; }
.opt.wrong { background: #fff0f5; box-shadow: 0 0 0 3px var(--bad); animation: shake .35s; }
.opt[disabled] { cursor: default; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.combo { font-family: var(--font-display); color: var(--pink-deep); }

/* Match */
.match-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 8px; }
.tile {
  appearance: none; cursor: pointer; border: 3px solid #fff; border-radius: 16px; padding: 10px 12px; min-height: 52px;
  background: #fff; box-shadow: 0 0 0 2px var(--line), 0 4px 0 var(--line); text-align: left; transition: transform .1s, box-shadow .15s;
  overflow-wrap: anywhere;
}
.tile.tag { font-family: var(--font-code); font-weight: 700; color: var(--lav-deep); text-align: center; }
.tile:hover:not([disabled]) { transform: translateY(-2px); }
.tile.sel { box-shadow: 0 0 0 3px var(--pink-deep), 0 4px 0 var(--pink); background: #fff2f8; }
.tile.done { background: #e8fbf2; box-shadow: 0 0 0 2px var(--mint-deep); color: #1d6e4f; cursor: default; }
.tile.wrong { animation: shake .35s; box-shadow: 0 0 0 3px var(--bad); }

/* Code views */
.code-box {
  font-family: var(--font-code); font-size: .92rem; background: #2f2547; color: #f7eaff; border-radius: 16px; padding: 10px;
  overflow-x: auto; box-shadow: inset 0 0 0 2px #4c3d72;
}
.code-line { display: flex; gap: 10px; align-items: center; padding: 4px 8px; border-radius: 10px; white-space: pre; min-height: 34px; }
.code-line .ln { color: #9c88c7; width: 1.6em; text-align: right; flex: none; user-select: none; }
.code-line.click { cursor: pointer; }
.code-line.click:hover { background: rgba(255,255,255,.08); }
.code-line.hl { background: rgba(255, 184, 214, .22); box-shadow: inset 3px 0 0 var(--pink); }
.code-line.fixed { background: rgba(178, 239, 214, .2); box-shadow: inset 3px 0 0 var(--mint); }
.code-line.wrong { animation: shake .35s; background: rgba(226, 87, 127, .25); }
.tok-tag { color: #ff9cd0; } .tok-attr { color: #ffe08a; } .tok-str { color: #9ff0c9; } .tok-com { color: #9c88c7; font-style: italic; }

/* Puzzle */
.puz { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.puz-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.puz-col h4 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1rem; color: var(--lav-deep); }
.blocks { display: flex; flex-direction: column; gap: 6px; min-height: 120px; padding: 8px; border-radius: 16px; background: #f7f1ff; box-shadow: inset 0 0 0 2px var(--line); }
.blocks.answer { background: #2f2547; box-shadow: inset 0 0 0 2px #4c3d72; }
.block {
  appearance: none; cursor: pointer; text-align: left; border: 0; border-radius: 12px; padding: 7px 10px; min-height: 38px;
  font-family: var(--font-code); font-size: .88rem; background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--lav);
  white-space: pre; overflow-x: auto; display: flex; align-items: center; gap: 6px; transition: transform .1s;
}
.block:hover { transform: translateX(3px); }
.answer .block { background: #42356a; color: #f7eaff; box-shadow: 0 3px 0 #251c3c; }
.answer .block.good { box-shadow: 0 3px 0 var(--mint-deep), inset 3px 0 0 var(--mint); }
.answer .block.badpos { box-shadow: 0 3px 0 var(--bad), inset 3px 0 0 var(--bad); }
.block .mv { margin-left: auto; display: flex; gap: 4px; }
.block .mv span { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,.15); }
.empty-note { color: #b9a8d8; font-size: .85rem; padding: 6px; }

/* Builder / Lab */
.lab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; min-height: 0; }
.lab-left, .lab-right { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.palette { display: flex; flex-wrap: wrap; gap: 6px; }
.editor {
  width: 100%; min-height: 220px; resize: vertical; border-radius: 16px; border: 0; padding: 12px;
  font-family: var(--font-code); font-size: .92rem; line-height: 1.55; tab-size: 2;
  background: #2f2547; color: #f7eaff; box-shadow: inset 0 0 0 2px #4c3d72; caret-color: #ff9cd0;
}
.editor:focus { outline: none; box-shadow: inset 0 0 0 2px var(--pink), 0 0 0 4px rgba(240,98,159,.2); }
.browser { border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 0 0 2px var(--line), var(--shadow-sm); display: flex; flex-direction: column; min-height: 240px; }
.browser-bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #f3ecfb; font-size: .8rem; }
.browser-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--pink); display: inline-block; }
.browser-bar i:nth-child(2) { background: var(--cream-deep); } .browser-bar i:nth-child(3) { background: var(--mint-deep); }
.browser-tab { margin-left: 6px; background: #fff; border-radius: 8px 8px 0 0; padding: 2px 10px; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preview-root { padding: 14px; overflow: auto; flex: 1; font-family: 'Mali', 'Tahoma', sans-serif; color: #333; line-height: 1.5; background: #fff; }
.preview-root h1 { font-size: 1.8em; margin: .3em 0; font-family: inherit; color: #d0457f; }
.preview-root h2 { font-size: 1.4em; margin: .4em 0; font-family: inherit; color: #6b48c8; }
.preview-root h3 { font-size: 1.15em; margin: .4em 0; font-family: inherit; }
.preview-root p { margin: .5em 0; }
.preview-root ul, .preview-root ol { margin: .5em 0; padding-left: 1.6em; }
.preview-root a { color: #2a73a8; text-decoration: underline; cursor: pointer; }
.preview-root img { max-width: 160px; height: auto; border-radius: 12px; display: inline-block; vertical-align: middle; background: #f6f0ff; }
.preview-root div { border: 2px dashed #e6d8f5; border-radius: 12px; padding: .5em .8em; margin: .4em 0; }
.preview-root button { border: 2px solid #c9b6f0; border-radius: 10px; background: #f5efff; padding: .3em .8em; cursor: pointer; }
.preview-root .img-broken { display: inline-flex; align-items: center; gap: .4em; padding: .4em .7em; border: 2px dashed #e2577f; border-radius: 10px; color: #9b2f57; font-size: .9em; }
.preview-empty { color: #aaa; font-style: italic; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .92rem; }
.checklist li { display: flex; gap: 8px; align-items: center; }
.checklist li i { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--lav); display: grid; place-items: center; flex: none; font-style: normal; font-size: .8rem; color: #fff; }
.checklist li.ok i { background: var(--mint-deep); border-color: var(--mint-deep); }
.checklist li.no i { border-color: var(--bad); }
.err-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .9rem; }
.err-list li { background: #fff0f5; color: #9b2f57; border-radius: 10px; padding: 6px 10px; }
.tabs { display: none; gap: 6px; }

/* Boss */
.boss-stage { position: relative; height: 230px; border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, #3d2b63, #7a4fa8 60%, #f2a7d4); }
.boss-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hp { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-family: var(--font-display); }
.hp .bar { height: 18px; }
.hp .bar > i { background: linear-gradient(90deg, #b18cff, #ff8fc8); animation: none; }

/* Result */
.result-wrap { margin: auto; width: min(720px, 100%); padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
.big-stars { display: flex; gap: 8px; }
.big-stars svg { width: clamp(56px, 12vw, 84px); height: auto; filter: drop-shadow(0 4px 0 rgba(0,0,0,.08)); }
.big-stars svg.on { animation: starPop .6s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes starPop { from { transform: scale(0) rotate(-40deg); } }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.result-grid .cell { padding: 10px; display: flex; flex-direction: column; gap: 2px; align-items: center; }
.result-grid .cell b { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.learned { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.sticker {
  display: inline-flex; align-items: center; gap: 6px; padding: .3em .8em .3em .4em; border-radius: 999px;
  background: #fff; box-shadow: 0 0 0 2px var(--line), 0 3px 0 var(--line); font-family: var(--font-body); font-size: .9rem; font-weight: 600; color: var(--lav-deep);
}
.sticker::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff 0 20%, var(--pink) 21%); box-shadow: 0 0 0 2px #fff; }
.chest { width: 120px; height: 100px; }

/* Book */
.book-wrap { display: grid; grid-template-columns: 280px 1fr; gap: 14px; padding: 8px 16px 16px; min-height: 0; flex: 1; }
.book-list { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.book-items { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 4px; min-height: 0; flex: 1; }
.book-item { appearance: none; border: 3px solid #fff; background: #fff; border-radius: 14px; padding: 8px 10px; text-align: left; cursor: pointer; box-shadow: 0 0 0 2px var(--line); display: flex; gap: 8px; align-items: center; }
.book-item[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--lav-deep); }
.book-item .nm { font-family: var(--font-code); font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.badge { font-size: .72rem; border-radius: 999px; padding: .1em .6em; white-space: nowrap; }
.badge.learned { background: var(--mint); color: #1d6e4f; }
.badge.found { background: var(--cream); color: #8a5a00; }
.badge.locked { background: #eee6f5; color: #9a8bb0; }
.book-detail { padding: 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; }
.book-detail h3 { font-family: var(--font-code); font-size: 1.6rem; color: var(--lav-deep); }
.sticker-shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.st-badge { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; text-align: center; font-family: var(--font-code); font-size: .72rem; font-weight: 700; padding: 6px; overflow: hidden; overflow-wrap: anywhere; line-height: 1.1; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--line); }
.st-badge.off { background: repeating-linear-gradient(45deg, #f2ecf8 0 6px, #ebe2f4 6px 12px); color: #b4a5c9; }

/* Shop */
.shop-wrap { display: grid; grid-template-columns: 300px 1fr; gap: 14px; padding: 8px 16px 16px; flex: 1; min-height: 0; }
.shop-left { padding: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.shop-left canvas { width: 100%; max-width: 240px; aspect-ratio: 1; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; font-size: .82rem; }
.slots span { background: #f6f0ff; border-radius: 999px; padding: .15em .6em; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; overflow-y: auto; padding: 4px; min-height: 0; align-content: start; }
.item-card { padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; }
.item-card canvas { width: 96px; height: 96px; }
.item-card b { font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; }
.item-card .price { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-display); }
.item-card .price svg { width: 20px; height: 20px; }
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px; }

/* Achievements & quests */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding: 8px 16px 16px; align-content: start; }
.ach { padding: 12px; display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.ach svg.medal { width: 64px; height: 64px; }
.ach.off svg.medal { filter: grayscale(1) opacity(.45); }
.ach b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; display: block; }
.ach small { color: var(--ink-soft); display: block; line-height: 1.4; }
.ach .when { color: var(--mint-deep); font-size: .8rem; margin-top: 2px; }
.quest-sec { padding: 4px 16px 10px; display: flex; flex-direction: column; gap: 8px; }
.quest-sec h3 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.quest-row { padding: 10px 12px; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }
.quest-row canvas { width: 52px; height: 52px; border-radius: 14px; background: #f8f2ff; }
.quest-row .qt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.quest-row .qt b { font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; }
.quest-row .qt small { color: var(--ink-soft); }
.qstate { font-size: .75rem; border-radius: 999px; padding: .1em .6em; white-space: nowrap; }
.qstate.s0 { background: #eee6f5; color: #7e6f95; } .qstate.s1 { background: var(--blue); color: #1f5d8a; }
.qstate.s2 { background: var(--cream); color: #8a5a00; } .qstate.s3 { background: var(--mint); color: #1d6e4f; }

/* Settings */
.settings { width: min(620px, 100%); margin: 0 auto; padding: 8px 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.set-row { padding: 12px 14px; display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.set-row .lbl { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.set-row .lbl b { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; }
.set-row .lbl small { color: var(--ink-soft); }
.switch { appearance: none; border: 0; cursor: pointer; width: 64px; height: 36px; border-radius: 999px; background: #e3d8ef; position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: left .2s; }
.switch[aria-checked="true"] { background: var(--mint-deep); }
.switch[aria-checked="true"]::after { left: 32px; }
.switch:focus-visible { outline: 3px solid var(--lav-deep); outline-offset: 2px; }
.seg { display: flex; gap: 4px; background: #f1e9fa; border-radius: 999px; padding: 4px; }
.seg button { appearance: none; border: 0; background: none; border-radius: 999px; padding: .3em .9em; cursor: pointer; min-height: 36px; font-family: var(--font-display); }
.seg button[aria-pressed="true"] { background: #fff; box-shadow: var(--shadow-sm); color: var(--lav-deep); }

/* Tutorial */
.tut-art { height: 170px; border-radius: 18px; background: linear-gradient(180deg, #fff6fb, #efe6ff); display: grid; place-items: center; gap: 8px; padding: 10px; }
.keys { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
.keys kbd { font-size: 1.1rem; padding: .2em .6em; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--pink-deep); width: 26px; border-radius: 6px; }

/* Toast */
#toasts { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(90%, 460px); }
.toast { padding: 8px 16px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 2px var(--line), var(--shadow); font-family: var(--font-display); font-size: 1rem; display: flex; align-items: center; gap: 8px; animation: toastIn .35s cubic-bezier(.2,1.4,.4,1) both; text-align: center; }
.toast.gold { background: linear-gradient(90deg, #fff7d6, #ffe9f4); box-shadow: 0 0 0 3px var(--cream-deep), var(--shadow); }
.toast svg { width: 22px; height: 22px; flex: none; }
@keyframes toastIn { from { transform: translateY(-14px) scale(.9); opacity: 0; } }
.fx-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

/* Ending */
.ending-stage { position: relative; flex: 1 0 auto; min-height: 190px; background: #fff4fb; }
.ending-card { margin: -10px auto 12px; width: min(680px, calc(100% - 24px)); padding: 14px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; flex: none; }

[tabindex="-1"]:focus { outline: none; }

/* Responsive */
@media (max-width: 860px) {
  .profile-wrap, .book-wrap, .shop-wrap { grid-template-columns: 1fr; }
  .book-wrap, .shop-wrap { display: flex; flex-direction: column; overflow-y: auto; }
  .book-wrap > *, .shop-wrap > * { flex: none; }
  .book-wrap > div:last-child { overflow: visible !important; }
  .book-items { max-height: 220px; flex: none; }
  .shop-grid { overflow: visible; }
  .lab { grid-template-columns: 1fr; }
  .lab.tabbed .lab-left.hide-m, .lab.tabbed .lab-right.hide-m { display: none; }
  .tabs { display: flex; }
  .puz { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  body { padding-block: 6px; }
  #app { border-radius: 20px; }
  .opts { grid-template-columns: 1fr; }
  .match-grid { grid-template-columns: 1fr 1.25fr; gap: 8px; }
  .tile { font-size: .88rem; padding: 8px; }
  .char-grid { gap: 8px; }
  .card-btn small { display: none; }
  .result-grid { grid-template-columns: 1fr 1fr 1fr; }
  .result-grid .cell b { font-size: 1.25rem; }
  .mg-head { grid-template-columns: auto 1fr; }
  .mg-meta { grid-column: 1 / -1; justify-content: flex-start; }
  .dialog canvas.portrait { width: 72px; height: 72px; }
  .node { min-width: 96px; padding: 5px 7px; }
  .node b { font-size: .9rem; }
  .quest-row { grid-template-columns: 44px 1fr; }
  .quest-row .act { grid-column: 1 / -1; }
  .tbtn { width: 58px; height: 58px; }
  .modal { padding: 14px; }
}
@media (max-height: 520px) {
  .hud .quest-card .quest-list { display: none; }
  .boss-stage { height: 150px; }
  .tut-art { height: 120px; }
}

/* Reduce motion (OS setting หรือในเกม) */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }

<main id="app" aria-label="HTML Candy World"><div id="toasts" aria-live="polite"></div><noscript><p style="padding:24px">เกมนี้ต้องเปิด JavaScript ในเบราว์เซอร์</p></noscript></main>

const KNOWLEDGE = [

const TAU = Math.PI * 2;

function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function ell(ctx, x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot || 0, 0, TAU); }
function circ(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(.1, r), 0, TAU); }
function fillC(ctx, c) { ctx.fillStyle = c; ctx.fill(); }
function strokeC(ctx, c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke(); }
function star(ctx, x, y, r1, r2, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = (i / (n * 2)) * TAU - Math.PI / 2 + (rot || 0);
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function seeded(seed) {
  let s = seed >>> 0 || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; };
}
const OUTLINE = '#5a3d78';

/* ---------- ใบหน้า ---------- */
function drawFace(ctx, x, y, expr, t, opt) {
  opt = opt || {};
  const ex = opt.eyeGap || 6.5, eyeY = y - 1;
  const blink = (t % 3.4) < 0.12 && expr !== 'celebrate';
  ctx.save();
  // แก้มชมพู
  ell(ctx, x - ex - 4, y + 4, 3.6, 2.4); fillC(ctx, 'rgba(255,120,170,.45)');
  ell(ctx, x + ex + 4, y + 4, 3.6, 2.4); fillC(ctx, 'rgba(255,120,170,.45)');
  ctx.lineCap = 'round';
  const dark = opt.eyeColor || '#3b2752';
  if (expr === 'happy' || expr === 'celebrate' || blink) {
    [-ex, ex].forEach(dx => {
      ctx.beginPath();
      if (blink && expr !== 'happy') { ctx.moveTo(x + dx - 2.5, eyeY); ctx.lineTo(x + dx + 2.5, eyeY); }
      else ctx.arc(x + dx, eyeY + 1, 2.8, Math.PI * 1.1, Math.PI * 1.9);
      strokeC(ctx, dark, 2);
    });
  } else if (expr === 'dizzy') {
    [-ex, ex].forEach(dx => {
      ctx.beginPath(); ctx.moveTo(x + dx - 2.5, eyeY - 2.5); ctx.lineTo(x + dx + 2.5, eyeY + 2.5);
      ctx.moveTo(x + dx + 2.5, eyeY - 2.5); ctx.lineTo(x + dx - 2.5, eyeY + 2.5); strokeC(ctx, dark, 2);
    });
  } else {
    const big = expr === 'curious' ? [2.6, 3.4] : [3, 3];
    [-ex, ex].forEach((dx, i) => {
      ell(ctx, x + dx, eyeY, big[i] * .85, big[i]); fillC(ctx, dark);
      circ(ctx, x + dx + 1, eyeY - 1.2, 1); fillC(ctx, '#fff');
    });
    if (expr === 'angry') {
      ctx.beginPath(); ctx.moveTo(x - ex - 3, eyeY - 6); ctx.lineTo(x - ex + 3, eyeY - 3.5);
      ctx.moveTo(x + ex + 3, eyeY - 6); ctx.lineTo(x + ex - 3, eyeY - 3.5); strokeC(ctx, dark, 2);
    }
    if (expr === 'encourage' || expr === 'worried') {
      ctx.beginPath(); ctx.moveTo(x - ex - 3, eyeY - 4.5); ctx.lineTo(x - ex + 2, eyeY - 6);
      ctx.moveTo(x + ex + 3, eyeY - 4.5); ctx.lineTo(x + ex - 2, eyeY - 6); strokeC(ctx, dark, 1.6);
    }
  }
  // ปาก
  const my = y + 6 + (opt.mouthDy || 0);
  ctx.beginPath();
  if (expr === 'celebrate' || expr === 'happy') {
    ctx.moveTo(x - 3.5, my - 1); ctx.quadraticCurveTo(x, my + 5, x + 3.5, my - 1); ctx.closePath();
    fillC(ctx, '#e0517f');
  } else if (expr === 'curious') {
    ell(ctx, x + 1, my + 1, 1.8, 2.2); fillC(ctx, '#e0517f');
  } else if (expr === 'worried' || expr === 'dizzy') {
    ctx.moveTo(x - 3, my + 2); ctx.quadraticCurveTo(x, my - 1.5, x + 3, my + 2); strokeC(ctx, dark, 1.8);
  } else if (expr === 'angry') {
    ctx.moveTo(x - 3.5, my + 1); ctx.lineTo(x + 3.5, my + 1); strokeC(ctx, dark, 1.8);
  } else {
    ctx.moveTo(x - 3, my); ctx.quadraticCurveTo(x - 1.5, my + 2.4, x, my); ctx.quadraticCurveTo(x + 1.5, my + 2.4, x + 3, my); strokeC(ctx, dark, 1.6);
  }
  ctx.restore();
}

function drawScarf(ctx, a, t, cols) {
  ctx.save();
  ell(ctx, a.x, a.y, 15, 4.6); ctx.save(); ctx.clip();
  cols.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(a.x - 16 + i * (32 / cols.length), a.y - 6, 32 / cols.length + 1, 12); });
  ctx.restore(); ell(ctx, a.x, a.y, 15, 4.6); strokeC(ctx, OUTLINE, 1.5);
  const sw = Math.sin(t * 5) * 2;
  ctx.beginPath(); ctx.moveTo(a.x + 6, a.y + 2); ctx.lineTo(a.x + 12 + sw, a.y + 14); ctx.lineTo(a.x + 5 + sw, a.y + 15); ctx.lineTo(a.x + 1, a.y + 3); ctx.closePath();
  fillC(ctx, cols[0]); strokeC(ctx, OUTLINE, 1.4);
  ctx.restore();
}

   เท้าอยู่ที่ (0,0) สูงประมาณ 64 หน่วย  st = {anim,t,facing,expr} */
const CHAR_SPEC = {
  toffee: { body: '#f6a46b', dark: '#d97b3f', belly: '#fff3e2', headR: 18, headY: -40 },
  puff:   { body: '#fbf8ff', dark: '#b7a3e6', belly: '#efe7ff', headR: 18, headY: -40 },
  kiwi:   { body: '#8fd9b6', dark: '#4fb48a', belly: '#fff6d6', headR: 18, headY: -40 }
};
function drawPlayer(ctx, id, outfit, st) {
  const sp = CHAR_SPEC[id] || CHAR_SPEC.toffee;
  const t = st.t || 0, f = st.facing || 1, anim = st.anim || 'idle';
  outfit = outfit || {};
  let bob = 0, sx = 1, sy = 1, legA = 0, armUp = 0;
  if (anim === 'idle') { bob = Math.sin(t * 3) * 1.2; sy = 1 + Math.sin(t * 3) * .015; }
  if (anim === 'walk') { legA = Math.sin(t * 13); bob = -Math.abs(Math.sin(t * 13)) * 2.4; }
  if (anim === 'jump') { sy = 1.07; sx = .94; legA = .6; armUp = .5; }
  if (anim === 'fall') { sy = .97; sx = 1.03; legA = -.4; armUp = .8; }
  if (anim === 'celebrate') { bob = -Math.abs(Math.sin(t * 6)) * 12; armUp = 1; sy = 1 + Math.sin(t * 12) * .03; }
  const expr = st.expr || (anim === 'celebrate' ? 'celebrate' : 'normal');

  ctx.save();
  ctx.translate(0, bob);
  // เงา
  ctx.save(); ctx.translate(0, -bob); ell(ctx, 0, 1, 15 - Math.min(8, -bob * .4), 3.5); fillC(ctx, 'rgba(80,40,110,.16)'); ctx.restore();
  ctx.scale(sx * f, sy);

  const T = t;
  // ด้านหลัง: ปีก ผ้าคลุม หาง
  if (outfit.wings && ITEM_DRAW[outfit.wings]) ITEM_DRAW[outfit.wings](ctx, { x: 0, y: -24 }, T);
  if (outfit.outfit === 'outfit_cape') ITEM_DRAW.outfit_cape(ctx, { x: 0, y: -14 }, T);
  if (id === 'toffee') {
    const wag = Math.sin(T * (anim === 'walk' ? 10 : 4)) * .25;
    ctx.save(); ctx.translate(-10, -12); ctx.rotate(-.5 + wag);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-22, -4, -20, -20); ctx.quadraticCurveTo(-8, -18, 2, -6); ctx.closePath();
    fillC(ctx, sp.body); strokeC(ctx, OUTLINE, 1.6);
    ctx.beginPath(); ctx.moveTo(-20, -20); ctx.quadraticCurveTo(-21, -12, -16, -11); ctx.quadraticCurveTo(-14, -16, -20, -20); fillC(ctx, '#fff');
    ctx.restore();
  }
  if (id === 'kiwi') {
    const wag = Math.sin(T * (anim === 'walk' ? 10 : 3)) * .15;
    ctx.save(); ctx.translate(-9, -10); ctx.rotate(wag);
    ctx.beginPath(); ctx.moveTo(0, -6); ctx.quadraticCurveTo(-18, -2, -24, 6); ctx.quadraticCurveTo(-12, 6, 0, 6); ctx.closePath();
    fillC(ctx, sp.body); strokeC(ctx, OUTLINE, 1.6);
    ctx.restore();
  }
  if (outfit.bag === 'bag_cookie') ITEM_DRAW.bag_cookie(ctx, { x: -15, y: -20 }, T);

  // ขา
  [-1, 1].forEach((s, i) => {
    const a = (i ? -legA : legA) * .5;
    ctx.save(); ctx.translate(s * 6, -9); ctx.rotate(a);
    rr(ctx, -4.5, 0, 9, 10, 4.5); fillC(ctx, sp.dark); strokeC(ctx, OUTLINE, 1.6);
    ctx.restore();
  });
  // ลำตัว
  if (id === 'puff') {
    [[-8, -18, 9], [8, -18, 9], [0, -13, 10], [0, -23, 10]].forEach(c => { circ(ctx, c[0], c[1], c[2]); fillC(ctx, sp.body); });
    [[-8, -18, 9], [8, -18, 9], [0, -13, 10]].forEach(c => { circ(ctx, c[0], c[1], c[2]); strokeC(ctx, '#c7b8ea', 1.3); });
    [[-8, -18, 8], [8, -18, 8], [0, -13, 9], [0, -22, 9]].forEach(c => { circ(ctx, c[0], c[1], c[2]); fillC(ctx, sp.body); });
  } else {
    ell(ctx, 0, -18, 13, 12); fillC(ctx, sp.body); strokeC(ctx, OUTLINE, 1.6);
    ell(ctx, 0, -16, 8, 8); fillC(ctx, sp.belly);
  }
  if (outfit.outfit === 'outfit_tutu') ITEM_DRAW.outfit_tutu(ctx, { x: 0, y: -12 }, T);
  if (outfit.bag === 'bag_cookie') ITEM_DRAW.bag_cookie_straps(ctx, { x: 0, y: -18 });
  // แขน
  [-1, 1].forEach(s => {

    ctx.restore();

  // หัว
  const hy = sp.headY;
  if (id === 'toffee') {
    [-1, 1].forEach(s => {

    });
    circ(ctx, 0, hy, 18); fillC(ctx, sp.body); strokeC(ctx, OUTLINE, 1.6);
    ell(ctx, 0, hy + 7, 11, 8); fillC(ctx, '#fff3e2');
    ell(ctx, 0, hy + 2, 2.6, 1.8); fillC(ctx, '#5a3d78');
    drawFace(ctx, 0, hy - 1, expr, T, { mouthDy: 1 });
  } else if (id === 'puff') {
    [-1, 1].forEach(s => { ell(ctx, s * 17, hy + 2, 7, 4, s * .5); fillC(ctx, '#d9cbf5'); strokeC(ctx, OUTLINE, 1.4); });
    for (let i = 0; i < 9; i++) { const a = i / 9 * TAU; circ(ctx, Math.cos(a) * 14, hy + Math.sin(a) * 13, 7.5); fillC(ctx, '#fbf8ff'); }
    for (let i = 0; i < 9; i++) { const a = i / 9 * TAU; ctx.beginPath(); ctx.arc(Math.cos(a) * 14, hy + Math.sin(a) * 13, 7.5, a - 1.2, a + 1.2); strokeC(ctx, '#c7b8ea', 1.3); }
    ell(ctx, 0, hy + 2, 12, 12.5); fillC(ctx, '#f3e6ff'); strokeC(ctx, OUTLINE, 1.4);
    circ(ctx, -4, hy - 12, 6); fillC(ctx, '#fff'); circ(ctx, 4, hy - 13, 6); fillC(ctx, '#fff');
    drawFace(ctx, 0, hy + 1, expr, T, { eyeGap: 5.5 });
  } else {
    // kiwi ไดโน
    [-8, 0, 8].forEach((x, i) => { ctx.beginPath(); ctx.moveTo(x - 5, hy - 13 + Math.abs(x) * .3); ctx.lineTo(x, hy - 23 + Math.abs(x) * .3); ctx.lineTo(x + 5, hy - 13 + Math.abs(x) * .3); ctx.closePath(); fillC(ctx, ['#ff9cc8', '#ffd36e', '#ff9cc8'][i]); strokeC(ctx, OUTLINE, 1.4); });
    rr(ctx, -18, hy - 16, 36, 32, 15); fillC(ctx, sp.body); strokeC(ctx, OUTLINE, 1.6);
    ell(ctx, 0, hy + 8, 10, 6); fillC(ctx, '#bdf0d8');
    circ(ctx, -3, hy + 6, 1); fillC(ctx, OUTLINE); circ(ctx, 3, hy + 6, 1); fillC(ctx, OUTLINE);
    drawFace(ctx, 0, hy - 3, expr, T, { mouthDy: 3 });
  }
  if (outfit.acc === 'acc_glasses') ITEM_DRAW.acc_glasses(ctx, { x: 0, y: hy - 3 }, T);
  if (outfit.scarf && ITEM_DRAW[outfit.scarf]) ITEM_DRAW[outfit.scarf](ctx, { x: 0, y: -27 }, T);
  if (outfit.hat && ITEM_DRAW[outfit.hat]) ITEM_DRAW[outfit.hat](ctx, { x: 0, y: hy - 22, r: 18 }, T);
  if (outfit.acc === 'acc_wand') ITEM_DRAW.acc_wand(ctx, { x: 16, y: -16 }, T);
  ctx.restore();
}

/* ---------- NPC ---------- */
function drawNPC(ctx, id, t, expr) {
  expr = expr || 'normal';
  ctx.save();
  const bob = Math.sin(t * 2.6) * 1.4;
  if (id !== 'ghost' && id !== 'sign') { ell(ctx, 0, 1, 16, 3.6); fillC(ctx, 'rgba(80,40,110,.16)'); }
  ctx.translate(0, bob);
  if (id === 'milky') {

      ell(ctx, 0, -14, 6, 16); fillC(ctx, '#fff'); strokeC(ctx, OUTLINE, 1.6);
      ell(ctx, 0, -13, 3, 11); fillC(ctx, '#ffc4dc');

    [-1, 1].forEach(s => { rr(ctx, s * 6 - 4, -10, 8, 10, 4); fillC(ctx, '#f1e9f7'); strokeC(ctx, OUTLINE, 1.5); });
    circ(ctx, 0, -40, 17); fillC(ctx, '#fff'); strokeC(ctx, OUTLINE, 1.6);
    drawFace(ctx, 0, -40, expr, t);

    [-1, 1].forEach(s => { rr(ctx, s * 6 - 4, -10, 8, 10, 4); fillC(ctx, '#f57eb3'); strokeC(ctx, OUTLINE, 1.5); });
    [-1, 1].forEach(s => { ctx.beginPath(); ctx.moveTo(s * 16, -46); ctx.lineTo(s * 13, -64); ctx.lineTo(s * 3, -55); ctx.closePath(); fillC(ctx, '#ff9cc8'); strokeC(ctx, OUTLINE, 1.6); });
    circ(ctx, 0, -40, 17); fillC(ctx, '#ff9cc8'); strokeC(ctx, OUTLINE, 1.6);
    drawFace(ctx, 0, -40, expr, t, { eyeColor: '#3b2752' });
    ctx.beginPath(); [-1, 1].forEach(s => { ctx.moveTo(s * 9, -35); ctx.lineTo(s * 20, -37); ctx.moveTo(s * 9, -33); ctx.lineTo(s * 20, -32); }); strokeC(ctx, '#c4568a', 1);
    // โบว์
    ctx.save(); ctx.translate(9, -55); ctx.rotate(.3);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-7, -5); ctx.lineTo(-7, 5); ctx.closePath(); ctx.moveTo(0, 0); ctx.lineTo(7, -5); ctx.lineTo(7, 5); ctx.closePath(); fillC(ctx, '#8fd0ff'); strokeC(ctx, OUTLINE, 1.2);
    ctx.restore();
  } else if (id === 'coco') {
    ell(ctx, 0, -19, 15, 14); fillC(ctx, '#fff'); strokeC(ctx, OUTLINE, 1.6); // เสื้อกาวน์
    ell(ctx, 0, -17, 7, 9); fillC(ctx, '#d8b48a');
    rr(ctx, 6, -20, 6, 6, 1.5); fillC(ctx, '#cfe9ff'); strokeC(ctx, OUTLINE, 1);
    [-1, 1].forEach(s => { rr(ctx, s * 7 - 4.5, -10, 9, 10, 4.5); fillC(ctx, '#c79a6c'); strokeC(ctx, OUTLINE, 1.5); });
    [-1, 1].forEach(s => { circ(ctx, s * 13, -55, 6.5); fillC(ctx, '#d8b48a'); strokeC(ctx, OUTLINE, 1.5); circ(ctx, s * 13, -55, 3.2); fillC(ctx, '#f2d2b0'); });
    circ(ctx, 0, -40, 18); fillC(ctx, '#d8b48a'); strokeC(ctx, OUTLINE, 1.6);
    ell(ctx, 0, -33, 8, 6); fillC(ctx, '#f2d2b0');
    ell(ctx, 0, -36, 2.8, 2); fillC(ctx, '#5a3d78');
    drawFace(ctx, 0, -42, expr, t, { mouthDy: 3 });
    // แว่นแล็บบนหัว
    rr(ctx, -15, -59, 30, 7, 3.5); fillC(ctx, '#8fd0ff'); strokeC(ctx, OUTLINE, 1.4);
    circ(ctx, -7, -55.5, 3); fillC(ctx, '#d8f2ff'); circ(ctx, 7, -55.5, 3); fillC(ctx, '#d8f2ff');
  } else if (id === 'pudding') {
    const w = 1 + Math.sin(t * 5) * .04;
    ctx.save(); ctx.scale(w, 2 - w);
    ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(-17, -40); ctx.quadraticCurveTo(0, -48, 17, -40); ctx.lineTo(22, 0); ctx.closePath();
    fillC(ctx, '#ffe07a'); strokeC(ctx, OUTLINE, 1.6);
    ctx.beginPath(); ctx.moveTo(-17.5, -38); ctx.quadraticCurveTo(0, -48, 17.5, -38); ctx.lineTo(18.5, -31);
    for (let i = 0; i <= 6; i++) { const x = 18.5 - i * (37 / 6); ctx.quadraticCurveTo(x - 3, -24 - (i % 2) * 6, x - 6, -30); }
    ctx.closePath(); fillC(ctx, '#b8662e'); strokeC(ctx, OUTLINE, 1.4);
    ell(ctx, -7, -41, 4, 1.6, -.2); fillC(ctx, 'rgba(255,255,255,.45)');

    ctx.beginPath(); ctx.moveTo(0, -55); ctx.quadraticCurveTo(3, -62, 7, -63); strokeC(ctx, '#4f9a5b', 1.6);
    circ(ctx, -2, -52, 1.4); fillC(ctx, '#fff');
    drawFace(ctx, 0, -14, expr, t);
  } else if (id === 'ghost') {
    drawGhost(ctx, t, expr, 1);
  } else if (id === 'sign') {
    rr(ctx, -3, -40, 6, 40, 2); fillC(ctx, '#c58a5a'); strokeC(ctx, OUTLINE, 1.4);
    rr(ctx, -28, -66, 56, 32, 8); fillC(ctx, '#fff3dc'); strokeC(ctx, OUTLINE, 1.8);
    rr(ctx, -24, -62, 48, 24, 6); fillC(ctx, '#ffd8e8');
    ctx.fillStyle = '#7d5ad8'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(expr === 'fixed' ? '<h1>' : '< ? >', 0, -50);

  }
  ctx.restore();
}
function drawGhost(ctx, t, expr, scale) {
  ctx.save(); ctx.scale(scale, scale);
  const fy = Math.sin(t * 2.2) * 4 - 18;
  ctx.translate(0, fy);
  const glitch = expr === 'angry' && Math.sin(t * 20) > .85 ? 2 : 0;
  ctx.translate(glitch, 0);
  ctx.beginPath(); ctx.moveTo(-20, -6); ctx.bezierCurveTo(-20, -52, 20, -52, 20, -6);
  for (let i = 0; i <= 5; i++) { const x = 20 - i * 8; ctx.quadraticCurveTo(x - 4, 4 + Math.sin(t * 6 + i) * 3, x - 8, -4 + (i % 2) * 2); }
  ctx.closePath();
  const g = ctx.createLinearGradient(0, -48, 0, 6);
  if (expr === 'friendly') { g.addColorStop(0, '#f7f0ff'); g.addColorStop(1, '#e0d0ff'); } else { g.addColorStop(0, '#c7a6ff'); g.addColorStop(1, '#9a6ff0'); }
  fillC(ctx, g); strokeC(ctx, OUTLINE, 1.8);
  ell(ctx, -8, -36, 5, 3, -.5); fillC(ctx, 'rgba(255,255,255,.5)');
  drawFace(ctx, 0, -24, expr === 'friendly' ? 'happy' : expr, t, { eyeGap: 7 });
  ctx.fillStyle = expr === 'friendly' ? '#a68bf0' : '#ffe0f4'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center'; ctx.fillText('</>', 0, -40);
  if (expr === 'angry' || expr === 'normal') {
    for (let i = 0; i < 3; i++) { const a = t * 2 + i * 2.1; ctx.fillStyle = 'rgba(255,140,200,.7)'; ctx.fillRect(Math.cos(a) * 28 - 2, -26 + Math.sin(a) * 18 - 2, 4, 4); }
  }
  if (expr === 'dizzy') {
    for (let i = 0; i < 3; i++) { const a = t * 4 + i * 2.1; star(ctx, Math.cos(a) * 16, -50 + Math.sin(a) * 4, 4, 1.8, 5, a); fillC(ctx, '#fff3a6'); }
  }
  ctx.restore();
}

/* ---------- ภาพ Portrait บน canvas เล็ก ---------- */
function paintPortrait(canvas, who, expr, t, outfit, charId) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = canvas.clientWidth || canvas.width, h = canvas.clientHeight || canvas.height;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
  const s = Math.min(canvas.width, canvas.height) / 92;
  ctx.setTransform(s, 0, 0, s, canvas.width / 2, canvas.height * .86);
  if (who === 'player') drawPlayer(ctx, charId, outfit, { anim: expr === 'celebrate' ? 'celebrate' : 'idle', t: t, facing: 1, expr: expr });
  else if (who === 'ghost') { ctx.translate(0, 8); drawGhost(ctx, t, expr, 1.1); }
  else drawNPC(ctx, who, t, expr);
}

/* ---------- ไอคอนไอเทมในร้าน ---------- */
function paintItemIcon(canvas, itemId, t) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = canvas.clientWidth || 96;
  if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(w * dpr); }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
  const s = canvas.width / 64;
  ctx.setTransform(s, 0, 0, s, canvas.width / 2, canvas.height / 2);
  circ(ctx, 0, 0, 29); fillC(ctx, '#fbf4ff');
  const slot = (SHOP_ITEMS.find(i => i.id === itemId) || {}).slot;
  const d = ITEM_DRAW[itemId];
  if (!d) return;
  if (slot === 'hat') d(ctx, { x: 0, y: -2, r: 18 }, t);
  else if (slot === 'scarf') d(ctx, { x: -3, y: -4 }, t);
  else if (slot === 'wings') d(ctx, { x: 0, y: 2 }, t);
  else if (slot === 'bag') d(ctx, { x: 0, y: 0 }, t);
  else if (slot === 'outfit') d(ctx, { x: 0, y: -6 }, t);
  else if (itemId === 'acc_glasses') { ctx.scale(1.5, 1.5); d(ctx, { x: 0, y: 1 }, t); }
  else d(ctx, { x: -2, y: 18 }, t);
}

      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: opt.g == null ? 1 : opt.g, life: .8 + Math.random() * .7, s: 4 + Math.random() * 6, r: Math.random() * TAU, vr: (Math.random() - .5) * 10, k: kind || (Math.random() < .5 ? 'star' : 'conf'), c: CANDY_COLS[i % 5] });

})();

function labParse(src) {
  const errors = [], notes = [];
  const root = { tag: '#root', attrs: {}, children: [], line: 0 };
  const stack = [root];

      const m = /^<\/\s*([a-zA-Z][a-zA-Z0-9]*)\s*>/.exec(src.slice(i, i + 60));

      const name = m[1].toLowerCase();

      if (LAB_DANGER.has(name)) continue;

      if (inStack(name)) {

        if (inner[3]) frag.appendChild(h('span', { class: 'tok-tag', text: inner[3] }));
      }

  }

}

/* ---------- เลือกคำถาม: ไม่ซ้ำในรอบเดียวกัน แล้วสุ่มตัวเลือก ---------- */
function pickQuestions(levels, count, used) {
  let pool = QUESTIONS.filter(q => levels.includes(q.lv));
  let fresh = pool.filter(q => !used.has(q.id));
  if (fresh.length < count) fresh = pool;
  const qs = shuffle(fresh).slice(0, count);
  qs.forEach(q => used.add(q.id));
  return qs.map(q => ({ src: q, opts: shuffle(q.a.map((t, i) => ({ t, ok: i === 0 }))) }));
}

  F.body.append(h('div', { class: 'match-grid' }, h('div', { class: 'match-col' }, h('h4', { class: 'ribbon', text: 'แท็ก', style: 'align-self:flex-start' }), left), h('div', { class: 'match-col' }, h('h4', { class: 'ribbon', text: 'หน้าที่', style: 'align-self:flex-start' }), right)), fb, h('div', { class: 'modal-actions' }, hintBtn));

    for (let i = 0; i < 3; i++) starWrap.appendChild(h('span', { svg: i < st ? ICONS.star : ICONS.starOff, style: 'display:inline-grid;width:22px;height:22px' }));
    starWrap.setAttribute('aria-label', 'ดาวที่คาดว่าจะได้ ' + st + ' ดวง');
    qTitle.textContent = 'ด่าน ' + level.id + ' · ' + level.name;
    qText.textContent = ready ? (level.boss ? 'พร้อมแล้ว! ไปที่ประตูห้องบอสทางขวาสุด' : 'ภารกิจครบแล้ว! ไปที่ประตูทางออกทางขวาสุด') : 'ภารกิจ ' + done + '/' + total + ' · เก็บแท็กและช่วยเพื่อน ๆ';
    qBar.style.width = Math.round(100 * done / total) + '%';

  /* ---------- การโต้ตอบ ---------- */
  function requirementsMissing() {
    const miss = [];
    const tl = run.tags.filter(t => !t.got).length;
    if (tl) miss.push('เก็บแท็กอีก ' + tl + ' ชิ้น');
    run.stations.filter(s => !s.done).forEach(s => miss.push(s.title));
    return miss;
  }
  function findNear() {
    const px = run.p.x + run.p.w / 2;
    let best = null, bd = 1e9;
    run.stations.forEach(s => { const d = Math.abs(s.x - px); if (d < 70 && d < bd) { bd = d; best = { kind: 'station', s }; } });
    const ex = level.exit || level.boss;
    if (Math.abs(ex - px) < (level.boss ? 90 : 60) && bd > 1e8) best = { kind: level.boss ? 'boss' : 'exit' };
    return best;
  }
  function interact() {
    if (run.paused || run.finished || modalStack.length) return;

    const miss = requirementsMissing();
    if (miss.length) {
      run.paused = true; clearInput();

          h('ul', { class: 'goal-list' }, miss.map(m => h('li', { text: m }))))),
        actions: [{ label: 'ไปต่อ', cls: 'mint' }], onClose: () => { run.paused = false; clearInput(); } });
      return;
    }
    if (n.kind === 'boss') return startBoss();
    finishLevel();
  }

      onClose: () => { if (!started) { run.paused = false; clearInput(); } } });
  }
  function launch(s) {
    run.paused = true; clearInput();

      done(res) {
        s.done = true; s.result = res;

        if (!res.hints) gameEvent('nohint');
        if (s.bridge) { run.bridge = true; toast('สะพานสายรุ้งปรากฏแล้ว! ข้ามหุบเขาได้', 'gold', 'spark'); spawnParts(level.gap[0] + 150, GROUND_Y - 10, 40); }
        run.p.celebrate = 1.6;
        floater(s.x, GROUND_Y - 110, '+' + (res.earned + (res.bonus || 0)) + ' คะแนน', '#f0629f');
        spawnParts(s.x, GROUND_Y - 60, 24);

  function showGuide() {

    else if (nextTag) msg = 'ยังมีแท็ก ' + nextTag.label + ' รออยู่' + dir(nextTag.x) + (nextTag.y < 380 ? ' บนแท่นลอย ลองกระโดดขึ้นไปนะ' : '');
    else msg = 'ครบหมดแล้ว! ไปที่' + (level.boss ? 'ประตูห้องบอส' : 'ประตูทางออก') + 'ทางขวาสุดได้เลย';

    const sfx = h('button', { class: 'switch', role: 'switch', 'aria-checked': String(S.settings.sfx), 'aria-label': 'เสียงเอฟเฟกต์', onclick: () => { S.settings.sfx = !S.settings.sfx; sfx.setAttribute('aria-checked', String(S.settings.sfx)); applySettings(); save(); } });
    const pm = openModal({ title: 'หยุดเกมชั่วคราว', content: h('div', { style: 'display:flex;flex-direction:column;gap:10px' },

      h('div', { class: 'set-row panel', style: 'padding:8px 12px' }, h('div', { class: 'lbl' }, h('b', { text: 'เพลง' })), music),
      h('div', { class: 'set-row panel', style: 'padding:8px 12px' }, h('div', { class: 'lbl' }, h('b', { text: 'เสียงเอฟเฟกต์' })), sfx),
      h('div', { class: 'menu-col', style: 'width:100%' },
        h('button', { class: 'btn mint', autofocus: true, onclick: () => { SFX.play('click'); pm.close(); } }, h('span', { svg: ICONS.play, style: 'display:inline-grid' }), 'เล่นต่อ'),
        h('button', { class: 'btn lav', onclick: () => { pm.close(); run.paused = true; openTutorial(() => { run.paused = false; clearInput(); }); } }, 'วิธีเล่น'),
        h('button', { class: 'btn cream', onclick: () => confirmBox('เริ่มด่านใหม่?', 'ความคืบหน้าในด่านรอบนี้จะหายไป (เหรียญที่เก็บแล้วยังอยู่)', 'เริ่มใหม่', () => go('game', { level: level.id })) }, 'เริ่มด่านใหม่'),
        h('button', { class: 'btn ghost', onclick: () => confirmBox('กลับแผนที่?', 'ความคืบหน้าในด่านรอบนี้จะหายไป (เหรียญที่เก็บแล้วยังอยู่)', 'กลับแผนที่', () => go('map')) }, h('span', { svg: ICONS.map, style: 'display:inline-grid' }), 'กลับแผนที่'))),
      onClose: () => { if (currentScreen === 'game') { run.paused = false; clearInput(); } } });
  }

  /* ---------- บอส / จบด่าน ---------- */
  function startBoss() {
    run.paused = true; clearInput();
    openBossBattle(run, {
      win(res) {
        run.bossResult = res; run.base += res.earned; run.max += res.max; run.bonus += res.bonus; run.hints += res.hints || 0;
        run.restored = true; learn(['debug', 'nesting']);
        finishLevel();
      },
      cancel() { run.paused = false; clearInput(); }
    });
  }
  function finishLevel() {
    if (run.finished) return;
    run.finished = true; run.p.celebrate = 5; clearInput();
    SFX.play('star');
    const acc = run.max ? Math.round(100 * run.base / run.max) : 0;
    const stars = starsFor(acc), passed = acc >= 60;
    const r = S.levels[level.id];
    const firstClear = passed && !r.passed;
    let coins = 0;
    if (passed) { coins += firstClear ? 20 : 0; coins += Math.max(0, stars - r.bestStars) * 10; }
    const isBoss = !!level.boss && passed;
    let firstBoss = false;
    if (isBoss && !S.bossDefeated) { S.bossDefeated = true; firstBoss = true; coins += 60; if (!S.owned.includes('hat_rainbow')) S.owned.push('hat_rainbow'); }
    const prevBest = { stars: r.bestStars, score: r.bestScore };
    r.plays++;
    if (passed) {
      r.passed = true;
      const nx = S.levels[level.id + 1];
      var unlockedNext = nx && !nx.unlocked;
      if (nx) nx.unlocked = true;
      gameEvent('clear');
      if (!run.hints) S._noHintClear = true;
    }
    r.bestStars = Math.max(r.bestStars, passed ? stars : 0);
    r.bestScore = Math.max(r.bestScore, run.base + run.bonus);
    r.bestAcc = Math.max(r.bestAcc, acc);
    addCoins(coins);
    checkAchievements(); delete S._noHintClear;
    save();
    const res = { level: level.id, acc, stars, passed, score: run.base + run.bonus, base: run.base, max: run.max, bonus: run.bonus,
      coins, coinsPicked: run.coinsGot, firstClear, unlockedNext: !!unlockedNext, learned: [...run.learned], hints: run.hints,
      newBest: (run.base + run.bonus) > prevBest.score, firstBoss, boss: !!level.boss };
    scope.timeout(() => go('result', res), reduceMotion() ? 300 : 1300);
  }

  /* ---------- ฟิสิกส์ ---------- */
  function floats() {
    const f = level.floats.map(([x, y, w]) => ({ x, y, w }));
    if (run.bridge && level.gap) f.push({ x: level.gap[0] - 10, y: GROUND_Y, w: level.gap[1] - level.gap[0] + 20, bridge: true });
    return f;
  }
  function step(dt) {
    const p = run.p;
    const left = Keys.isDown('ArrowLeft', 'KeyA') || run.touch.left;
    const right = Keys.isDown('ArrowRight', 'KeyD') || run.touch.right;
    const dir = (right ? 1 : 0) - (left ? 1 : 0);
    const acc = PHYS.accel * (p.onGround ? 1 : PHYS.air);
    if (dir) { p.vx += dir * acc * dt; p.facing = dir; }
    else if (p.onGround) { const f = PHYS.fric * dt; p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f; }
    else p.vx *= Math.pow(.2, dt);
    p.vx = clamp(p.vx, -PHYS.max, PHYS.max);

    p.coyote = p.onGround ? PHYS.coyote : Math.max(0, p.coyote - dt);
    p.jumpBuf = Math.max(0, p.jumpBuf - dt);
    if (p.jumpBuf > 0 && p.coyote > 0) { p.vy = -PHYS.jump; p.jumpBuf = 0; p.coyote = 0; p.onGround = false; SFX.play('jump'); spawnParts(p.x + p.w / 2, p.y + p.h, 6, true); }
    p.vy = Math.min(1200, p.vy + PHYS.grav * dt);

    // แกน X + ชนผนังพื้น
    p.x += p.vx * dt;
    p.x = clamp(p.x, 0, level.width - p.w);
    level.ground.forEach(([x1, x2]) => {
      if (p.y + p.h > GROUND_Y + 2 && p.x + p.w > x1 && p.x < x2) {
        if (p.vx > 0 && p.x + p.w - x1 < 20) p.x = x1 - p.w; else if (p.vx < 0 && x2 - p.x < 20) p.x = x2;
      }
    });
    // แกน Y
    const prevBottom = p.y + p.h;
    p.y += p.vy * dt;
    p.onGround = false;
    if (p.vy >= 0) {
      level.ground.forEach(([x1, x2]) => {
        if (p.x + p.w > x1 + 4 && p.x < x2 - 4 && prevBottom <= GROUND_Y + 2 && p.y + p.h >= GROUND_Y) { p.y = GROUND_Y - p.h; p.vy = 0; p.onGround = true; }
      });
      floats().forEach(f => {
        if (p.x + p.w > f.x + 4 && p.x < f.x + f.w - 4 && prevBottom <= f.y + 2 && p.y + p.h >= f.y) { p.y = f.y - p.h; p.vy = 0; p.onGround = true; }
      });
    }
    // ตกเหว
    if (p.y > 640) {
      p.x = run.spawn.x; p.y = GROUND_Y - p.h - 40; p.vx = 0; p.vy = 0;
      SFX.play('wrong'); toast('ตกลงไปในเยลลี่! กลับมาที่จุดเช็กพอยต์แล้ว', '', 'spark');
    }
    // Checkpoint
    run.cps.forEach(c => { if (!c.on && p.x + p.w / 2 > c.x && p.onGround) { c.on = true; run.spawn.x = c.x; SFX.play('star'); floater(c.x, 360, 'เช็กพอยต์!', '#2fae7c'); save(); } });
    // ของสะสม
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    run.tags.forEach(t => {
      if (t.got) return;
      if (Math.abs(cx - t.x) < 40 && Math.abs(cy - t.y) < 38) {
        t.got = true; run.base += 4; run.tagsGot++;
        SFX.play('tag'); floater(t.x, t.y - 26, 'ได้ ' + t.label, '#7d5ad8'); spawnParts(t.x, t.y, 14);
        if (discover(TOKEN_TO_KNOW[t.label])) toast('พบแท็กใหม่ในสมุดความรู้: ' + t.label, '', 'book');
        gameEvent('tag'); save(); updateHud();
      }
    });
    run.coins.forEach(c => {
      if (c.got) return;
      if (Math.abs(cx - c.x) < 30 && Math.abs(cy - c.y) < 46) {
        c.got = true; run.bonus += 5;
        if (!c.ghost) {
          addCoins(1); run.coinsGot++; S.stats.coinsCollected++;
          const arr = S.collectedCoins[level.id] || (S.collectedCoins[level.id] = []);
          if (!arr.includes(c.i)) arr.push(c.i);
          gameEvent('coin'); save();
        }
        SFX.play('coin'); floater(c.x, c.y - 20, c.ghost ? '+5' : '+1 เหรียญ', '#e0a21a'); spawnParts(c.x, c.y, 8);
        updateHud();
      }
    });
    // แอนิเมชัน
    p.animT += dt;
    if (p.celebrate > 0) p.celebrate -= dt;
    const camTarget = clamp(p.x + p.w / 2 - viewW * .42, 0, Math.max(0, level.width - viewW));
    run.camX += (camTarget - run.camX) * Math.min(1, dt * 6);
    run.near = findNear();
  }

  /* ---------- อนุภาคและข้อความลอย ---------- */
  function spawnParts(x, y, n, dust) {
    if (reduceMotion()) return;
    for (let i = 0; i < n; i++) {
      const a = dust ? Math.PI + Math.random() * Math.PI : Math.random() * TAU, sp = dust ? 40 + Math.random() * 60 : 80 + Math.random() * 180;
      run.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (dust ? 0 : 60), life: dust ? .4 : .7 + Math.random() * .5, c: dust ? 'rgba(255,255,255,.9)' : CANDY_COLS[i % 5], s: dust ? 3 + Math.random() * 3 : 3 + Math.random() * 4, star: !dust && i % 2 === 0 });
    }
    if (run.parts.length > 300) run.parts.splice(0, run.parts.length - 300);
  }
  function floater(x, y, text, color) { run.floaters.push({ x, y, text, color, life: 1.3 }); }

  /* ---------- วาดฉาก ---------- */
  const ctx = canvas.getContext('2d');
  function render() {
    const t = run.t, th = level.theme;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.save(); ctx.translate(0, topPad);
    // ท้องฟ้าเต็มจอ
    ctx.save(); ctx.translate(0, -topPad); ctx.scale(1, (540 + topPad + 200) / 540); drawSky(ctx, level, viewW, t, run.restored); ctx.restore();
    // เมฆ
    run.decor.clouds.forEach(c => { const x = ((c.x - run.camX * .12 + t * c.sp) % (viewW + 400)) - 200; drawCloud(ctx, x < -200 ? x + viewW + 400 : x, c.y, c.s); });
    // ชั้นไกล
    run.decor.far.forEach(f => { const x = f.x - run.camX * .25; if (x > -200 && x < viewW + 200) { ctx.save(); ctx.translate(x, 300 + Math.sin(t * .8 + f.x) * 6); drawFarThing(ctx, level.key, f.v, f.s, t, level.key === 'castle' && !run.restored); ctx.restore(); } });
    // ชั้นกลาง
    run.decor.mid.forEach(m => { const x = m.x - run.camX * .55; if (x > -200 && x < viewW + 200) { ctx.save(); ctx.translate(x, 470); drawMidThing(ctx, level.key, m.v, m.c, m.s, t, run.restored); ctx.restore(); } });
    if (level.key === 'beach') { ctx.fillStyle = 'rgba(143,208,255,.55)'; ctx.fillRect(0, 420, viewW, 60); for (let x = -40; x < viewW + 40; x += 40) { ctx.beginPath(); ctx.arc(x + ((t * 20) % 40), 422, 20, Math.PI, TAU); fillC(ctx, 'rgba(255,255,255,.35)'); } }
    if (level.key === 'castle' && !run.restored) { ctx.fillStyle = 'rgba(120,80,170,.12)'; ctx.fillRect(0, -topPad, viewW, 540 + topPad); }

    // โลกของเกม
    ctx.save(); ctx.translate(-Math.round(run.camX), 0);
    const vx1 = run.camX - 100, vx2 = run.camX + viewW + 100;
    // เหว: เยลลี่ด้านล่าง
    ctx.fillStyle = shade(th.ground, 20); ctx.globalAlpha = .45; ctx.fillRect(vx1, 520, vx2 - vx1, 400); ctx.globalAlpha = 1;
    level.ground.forEach(([x1, x2]) => { if (x2 > vx1 && x1 < vx2) { drawGround(ctx, x1, x2, th, t); ctx.fillStyle = shade(th.ground, -22); ctx.fillRect(x1, 560, x2 - x1, 400); } });
    run.decor.sprinkles.forEach(s => { if (s.x > vx1 && s.x < vx2 && level.ground.some(([a, b]) => s.x > a + 10 && s.x < b - 10)) { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a); rr(ctx, -4, -1.5, 8, 3, 1.5); fillC(ctx, CANDY_COLS[s.c]); ctx.restore(); } });
    floats().forEach(f => { if (f.x + f.w > vx1 && f.x < vx2) drawFloat(ctx, f.x, f.bridge ? f.y - 4 : f.y, f.w, th, f.bridge ? 'bridge' : ''); });
    if (level.gap && !run.bridge) {
      const gx = (level.gap[0] + level.gap[1]) / 2;
      ctx.save(); ctx.globalAlpha = .45 + Math.sin(t * 3) * .15; ctx.setLineDash([10, 10]);
      ctx.beginPath(); ctx.moveTo(level.gap[0], GROUND_Y); ctx.lineTo(level.gap[1], GROUND_Y); strokeC(ctx, '#fff', 4); ctx.restore();
      ctx.fillStyle = 'rgba(90,61,120,.65)'; ctx.font = '600 15px Itim, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('สะพานหายไป…', gx, GROUND_Y - 24);
    }
    run.cps.forEach(c => drawCheckpoint(ctx, c.x, c.on, t));
    // ประตู
    const ready = !requirementsMissing().length;
    if (level.exit) drawDoor(ctx, level.exit, ready, t);
    if (level.boss) drawBossGate(ctx, level.boss, ready, t);
    // NPC / สถานี
    run.stations.forEach(s => {
      ctx.save(); ctx.translate(s.x, GROUND_Y); ctx.scale(.9, .9);
      drawNPC(ctx, s.npc, t + s.x, s.npc === 'sign' && s.done ? 'fixed' : (s.done ? 'happy' : (s.npc === 'ghost' ? 'angry' : 'normal')));
      ctx.restore();
      const by = GROUND_Y - (s.npc === 'sign' ? 92 : 88) + Math.sin(t * 3 + s.x) * 3;
      circ(ctx, s.x, by, 13); fillC(ctx, s.done ? '#2fae7c' : '#f0629f'); strokeC(ctx, '#fff', 3);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Itim, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(s.done ? '✓' : '!', s.x, by + 1);
    });
    run.coins.forEach(c => { if (!c.got && c.x > vx1 && c.x < vx2) drawCoin(ctx, c.x, c.y, t, c.ghost); });
    run.tags.forEach(tg => { if (!tg.got && tg.x > vx1 && tg.x < vx2) drawTagToken(ctx, tg.label, tg.x, tg.y, t); });
    // ผู้เล่น
    const p = run.p;
    let anim = 'idle';
    if (p.celebrate > 0) anim = 'celebrate';
    else if (!p.onGround) anim = p.vy < 0 ? 'jump' : 'fall';
    else if (Math.abs(p.vx) > 20) anim = 'walk';
    ctx.save(); ctx.translate(p.x + p.w / 2, p.y + p.h); ctx.scale(.84, .84);
    drawPlayer(ctx, S.profile.char, S.equipped, { anim, t: p.animT, facing: p.facing });
    ctx.restore();
    // ป้ายชื่อ
    ctx.font = '600 13px Itim, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const nm = S.profile.name, nw = ctx.measureText(nm).width + 14;
    rr(ctx, p.x + p.w / 2 - nw / 2, p.y - 30, nw, 18, 9); fillC(ctx, 'rgba(255,255,255,.85)');
    ctx.fillStyle = '#7d5ad8'; ctx.fillText(nm, p.x + p.w / 2, p.y - 21);
    // อนุภาค
    run.parts.forEach(q => { ctx.save(); ctx.globalAlpha = Math.min(1, q.life * 2); if (q.star) { star(ctx, q.x, q.y, q.s, q.s * .45, 5, q.life * 4); fillC(ctx, q.c); } else { circ(ctx, q.x, q.y, q.s); fillC(ctx, q.c); } ctx.restore(); });
    run.floaters.forEach(f => { ctx.save(); ctx.globalAlpha = Math.min(1, f.life * 1.5); ctx.font = '600 18px Itim, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y); ctx.restore(); });
    ctx.restore();
    ctx.restore();
  }

  /* ---------- ลูปหลัก ---------- */
  let raf = 0, last = performance.now(), lastNear = undefined;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    if (run.paused && !run.finished) return; // Pause หยุดเวลาและฟิสิกส์จริง
    run.t += dt;
    if (!run.finished) step(dt); else { run.p.animT += dt; run.p.vx = 0; }
    run.parts = run.parts.filter(q => { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 400 * dt; return q.life > 0; });
    run.floaters = run.floaters.filter(f => { f.life -= dt; f.y -= 40 * dt; return f.life > 0; });
    render();
    const n = run.near;
    const key = n ? (n.kind === 'station' ? n.s.id + n.s.done : n.kind) : '';
    if (key !== lastNear) {
      lastNear = key;
      if (!n) tip.hidden = true;
      else {
        tip.hidden = false; tipText.innerHTML = '';
        const who = n.kind === 'station' ? (n.s.npc === 'sign' ? 'อ่านป้าย' : 'คุยกับ ' + NPCS[n.s.npc].name) : n.kind === 'boss' ? 'เข้าห้องบอส' : 'เปิดประตูทางออก';
        tipText.append('กด ', h('kbd', { text: 'E' }), ' หรือปุ่มมือ เพื่อ' + who);
      }
    }
  }
  scope.add(() => cancelAnimationFrame(raf));
  scope.on(document, 'visibilitychange', () => { if (document.hidden && !run.paused && !run.finished && !modalStack.length) openPause(); });

  // เริ่มต้น
  scope.timeout(() => {
    resize(); updateHud(true);
    last = performance.now(); raf = requestAnimationFrame(frame);
    if (!S.tutorialSeen) { run.paused = true; openTutorial(() => { run.paused = false; clearInput(); }); }
    else toast(level.th + ' — ' + level.story, '', 'map');
  }, 0);
  return el;
}

function menuBackdrop(opts) {
  opts = opts || {};
  const cv = h('canvas', { class: 'bg-canvas', 'aria-hidden': 'true' });
  const rnd = seeded(42);
  const floaters = Array.from({ length: 26 }, (_, i) => ({ x: rnd(), y: rnd(), s: .5 + rnd(), k: i % 3, c: i % 5, sp: .02 + rnd() * .04 }));
  const lvl = LEVELS[0];
  Anim.add(cv, t => {
    const d = Math.min(2, devicePixelRatio || 1), w = cv.clientWidth, hh = cv.clientHeight;
    if (!w || !hh) return;
    if (cv.width !== Math.round(w * d) || cv.height !== Math.round(hh * d)) { cv.width = Math.round(w * d); cv.height = Math.round(hh * d); }
    const ctx = cv.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, hh); g.addColorStop(0, '#ffd9ec'); g.addColorStop(.55, '#e9dcff'); g.addColorStop(1, '#d4ecff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, hh);
    drawRainbow(ctx, w * .5, hh * 1.05, Math.min(w, hh * 1.4) * .62, .5);
    for (let i = 0; i < 5; i++) drawCloud(ctx, ((i * 260 + t * (6 + i * 2)) % (w + 300)) - 150, 40 + (i * 67) % (hh * .45), .7 + (i % 3) * .3, .85);
    // เกาะลอยฟ้า
    const isl = (x, y, s, key, v) => { ctx.save(); ctx.translate(x, y + Math.sin(t * .9 + x) * 6); drawFarThing(ctx, key, v, s, t, false); ctx.restore(); };
    isl(w * .12, hh * .62, Math.min(1.3, w / 700), 'village', 1); isl(w * .88, hh * .58, Math.min(1.3, w / 700), 'castle', 0);
    if (w > 700) { isl(w * .25, hh * .24, .8, 'forest', 1); isl(w * .78, hh * .2, .8, 'lab', 0); }
    floaters.forEach(f => {
      const x = f.x * w, y = ((f.y - t * f.sp) % 1 + 1) % 1 * (hh + 60) - 30;
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * .5 + f.x * 6);
      if (f.k === 0) { star(ctx, 0, 0, 8 * f.s, 3.4 * f.s, 5, 0); fillC(ctx, '#fff6b8'); }
      else if (f.k === 1) { circ(ctx, 0, 0, 7 * f.s); fillC(ctx, CANDY_COLS[f.c]); ctx.beginPath(); ctx.arc(0, 0, 4 * f.s, 0, 4); strokeC(ctx, '#fff', 2); }
      else { [-1, 1].forEach(s2 => { ctx.beginPath(); ctx.moveTo(s2 * 6 * f.s, 0); ctx.lineTo(s2 * 13 * f.s, -5 * f.s); ctx.lineTo(s2 * 13 * f.s, 5 * f.s); ctx.closePath(); fillC(ctx, CANDY_COLS[(f.c + 2) % 5]); }); circ(ctx, 0, 0, 7 * f.s); fillC(ctx, CANDY_COLS[f.c]); }
      ctx.restore();
    });
    if (opts.chars && hh > 380) {
      const base = hh - 8, s = Math.min(1.5, hh / 420);
      ctx.save(); ctx.translate(w * .1, base); ctx.scale(s, s); drawNPC(ctx, 'milky', t, 'happy'); ctx.restore();
      if (w > 640) { ctx.save(); ctx.translate(w * .9, base); ctx.scale(s, s); drawNPC(ctx, 'pudding', t + 1, 'happy'); ctx.restore(); }
    }
  });
  return cv;
}

    { title: 'ช่วยเพื่อน ๆ ทำภารกิจ', text: 'เพื่อนที่มีเครื่องหมาย ! มีภารกิจให้ทำ เช่น Candy Quiz, Tag Match, Code Puzzle, Fix the Bug และ Build a Website ตอบผิดไม่เป็นไร อ่านคำอธิบายแล้วลองใหม่ได้ ปุ่มหลอดไฟคือคำแนะนำจาก Milky',
      art: () => portraitCanvas('milky', 'happy', 120, '') },
    { title: 'ผ่านด่านและรับดาว', text: 'ทำภารกิจครบแล้วไปที่ประตูทางออก ความแม่นยำ 60% ขึ้นไปจึงผ่านด่าน · 1 ดาว 60–74% · 2 ดาว 75–89% · 3 ดาว 90% ขึ้นไป ใช้คำใบ้ได้แต่คะแนนข้อนั้นจะลดลง',
      art: () => h('div', { class: 'big-stars' }, [0, 1, 2].map(() => h('span', { svg: ICONS.star, style: 'display:inline-grid;width:56px' }))) }
  ];
  const prev = h('button', { class: 'btn ghost small', onclick: () => { if (i > 0) { i--; show(); SFX.play('click'); } } }, 'ก่อนหน้า');
  const next = h('button', { class: 'btn mint', onclick: () => { SFX.play('click'); if (i < slides.length - 1) { i++; show(); } else m.close(); } });
  const titleEl = h('b', { style: 'font-family:var(--font-display);font-weight:400;font-size:1.25rem;color:var(--lav-deep)' });
  function show() {
    const s = slides[i]; art.textContent = ''; art.appendChild(s.art()); titleEl.textContent = (i + 1) + '. ' + s.title; txt.textContent = s.text;
    dots.textContent = ''; slides.forEach((_, k) => dots.appendChild(h('i', { class: k === i ? 'on' : '' })));
    prev.disabled = i === 0; next.textContent = i === slides.length - 1 ? 'เริ่มเล่นเลย!' : 'ถัดไป';
  }
  const m = openModal({ title: 'วิธีเล่น HTML Candy World', size: 'mid', content: h('div', { style: 'display:flex;flex-direction:column;gap:10px' }, art, titleEl, txt, dots,
    h('div', { class: 'modal-actions' }, h('button', { class: 'btn ghost small', onclick: () => { SFX.play('click'); m.close(); } }, 'ข้าม'), prev, next)),
    onClose: () => { S.tutorialSeen = true; save(); if (onDone) onDone(); } });
  show();
  return m;
}

/* ========== BOOT ========== */
function boot() {
  S = loadSave();
  applySettings();
  makeLabImages();
  ensureDaily();
  checkAchievements();
  try { window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', applySettings); } catch (e) {}
  window.addEventListener('error', e => { console.error(e.error || e.message); });
  go('splash');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
